[project]
name = "auto-kg-constructor"
version = "0.1.0"
description = "AI engineering agents that transform document corpora into perfectly representative, temporally-versioned knowledge graphs with auto-generated APIs"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [
    { name = "Nitanshu Limbachiya" },
]
dependencies = [
    # Document parsing
    "docling>=2.70",
    # Graph database
    "neo4j>=5.25",
    # Temporal knowledge graph
    "graphiti-core>=0.5",
    # MCP server SDK
    "mcp>=1.5",
    # Core
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # LLM
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_kg"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
