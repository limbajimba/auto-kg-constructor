[project]
name = "auto-kg-constructor"
version = "0.1.0"
description = "AI engineering agents that transform document corpora into perfectly representative, temporally-versioned knowledge graphs with auto-generated APIs"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [
    { name = "Nitanshu Limbachiya" },
]
dependencies = [
    # Document parsing (Gemini 2.5 Pro API)
    "google-genai>=1.0",
    # Graph database
    "neo4j>=5.25",
    # Core data modelling
    "pydantic>=2.0",
    # PDF page-range extraction for chunked processing
    "pypdf>=4.0",
    # Environment variable management
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "ipython>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proof"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Neo4j and populated graph",
]
