services:
  neo4j:
    image: neo4j:5-community
    container_name: akg-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/changeme
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  proof:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akg-proof
    volumes:
      - ./corpora:/app/corpora:ro          # PDF input (read-only)
      - ./proof/outputs:/app/proof/outputs  # Parse output (writable)
    environment:
      - LOG_LEVEL=INFO
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-pro}
    deploy:
      resources:
        limits:
          memory: 512m   # API client, no local ML models
          cpus: "1.0"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
