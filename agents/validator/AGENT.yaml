name: validator
description: >
  Multi-pass validation of the constructed knowledge graph. Checks structural
  completeness, hierarchy correctness, content fidelity, cross-reference
  resolution rate, and functional correctness.
role: engineering-agent
phase: validation

inputs:
  - knowledge_graph    # The populated Neo4j graph
  - parsed_documents   # Original parsed docs for comparison
  - corpus_profile     # Expected patterns

outputs:
  - validation_report  # Pass/fail with detailed metrics

depends_on:
  - kg-builder

model: claude-sonnet-4-5

constraints:
  - Zero tolerance for missing nodes (every source paragraph must have a node)
  - Zero tolerance for duplicate nodes
  - Content fidelity checked via sampling (min 10% of nodes)
  - Cross-reference resolution rate must be reported

memory: MEMORY.md
skills_dir: skills/
