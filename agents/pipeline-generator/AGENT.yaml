name: pipeline-generator
description: >
  Takes a CorpusProfile and generates deterministic extraction code — regex
  patterns for cross-references, parsers for numbering schemes, validators
  for structure. The "LLM as software engineer" agent.
role: engineering-agent
phase: generation

inputs:
  - corpus_profile     # CorpusProfile from corpus-profiler

outputs:
  - extraction_pipeline  # Generated Python code for deterministic extraction

depends_on:
  - corpus-profiler

model: claude-sonnet-4-5

constraints:
  - Generated code must be deterministic (no LLM calls at extraction time)
  - All regex patterns must have test cases
  - Prefer explicit over clever — readability matters
  - Write reusable extractors that can be composed

memory: MEMORY.md
skills_dir: skills/
