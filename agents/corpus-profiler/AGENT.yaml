name: corpus-profiler
description: >
  Examines a document corpus to discover structural patterns, numbering schemes,
  cross-reference syntax, formatting semantics, and glossary conventions.
  Produces a CorpusProfile that drives all downstream extraction.
role: engineering-agent
phase: profiling

inputs:
  - parsed_documents  # DoclingDocument objects from the parsing layer

outputs:
  - corpus_profile    # CorpusProfile JSON — the blueprint for extraction

depends_on: []

model: claude-sonnet-4-5

constraints:
  - Never assume document structure — discover it empirically
  - Sample multiple sections before concluding a pattern exists
  - Flag low-confidence patterns explicitly
  - Write discovered patterns to MEMORY.md for future runs

memory: MEMORY.md
skills_dir: skills/
